# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries (required for all modern Android projects)
android.useAndroidX=true

# Enable Kotlin code style formatting rules
kotlin.code.style=official

# Disables non-transitive R classes for slightly faster builds (safe default for new projects)
android.nonTransitiveRClass=true
